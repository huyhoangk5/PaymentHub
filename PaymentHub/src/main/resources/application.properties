spring.application.name=PaymentHub

spring.datasource.url=jdbc:oracle:thin:@//10.10.0.202:1521/orcl
spring.datasource.username=DEMO
spring.datasource.password=DEMO
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ================= KAFKA CONFIGURATION =================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=paymenthub-export-worker-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=1
spring.kafka.consumer.properties.max.poll.interval.ms=900000
spring.kafka.listener.ack-mode=manual_immediate
app.kafka.export-topic=export_jobs

# ================= REDIS CONFIGURATION =================
spring.data.redis.host=localhost
spring.data.redis.port=6379
app.redis.export-channel=export:notifications
app.redis.job-ttl-hours=24

# ================= MINIO CONFIGURATION =================
app.minio.endpoint=http://localhost:9000
app.minio.access-key=minioadmin
app.minio.secret-key=minioadmin
app.minio.bucket-name=export-files
app.export.expiration-hours=24
